name: Build release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.vscode/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: fa8cecf91d7f31a1715a7a6524f208897ffb33ce
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Versao e release
        id: versao
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $linha = Select-String -Path src/app/main.cpp -Pattern 'setApplicationVersion\(QStringLiteral\("([^"]+)"\)\)'
          if (-not $linha) { throw "Versao nao encontrada em src/app/main.cpp" }
          $versao = $linha.Matches[0].Groups[1].Value
          gh release view $versao *> $null
          $publicada = $LASTEXITCODE -eq 0
          $publicar = (-not $publicada) -and ($env:GITHUB_REF -eq 'refs/heads/main')
          "versao=$versao" >> $env:GITHUB_OUTPUT
          "publicar=$($publicar.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if ($publicar) { "Versao $versao ainda sem release: este build publica a release." }
          else { "Versao $versao ja publicada ou build fora da main: so o artefato." }
          exit 0

      - name: Ambiente do MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: vcpkg no mesmo commit do build local
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git -C $env:VCPKG_INSTALLATION_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_INSTALLATION_ROOT checkout --force $env:VCPKG_COMMIT
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Restaurar pacotes compilados do vcpkg
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-triplets/**') }}

      - name: Qt estatico pelo vcpkg
        run: >
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install
          "qtbase[core,gui,widgets,harfbuzz,png]:x64-windows-static"
          "qtcharts[core]:x64-windows-static"
          --overlay-triplets=vcpkg-triplets --clean-after-build

      - name: Guardar pacotes compilados do vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg-triplets/**') }}

      - name: Compilar
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --preset msvc-static -DCMAKE_MAKE_PROGRAM=ninja "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build --preset msvc-static
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:LOCALAPPDATA\HydroEdit\build-static\src\app\HydroEdit2.exe" dist\HydroEdit2.exe

      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: HydroEdit2-${{ steps.versao.outputs.versao }}-${{ github.sha }}
          path: dist/HydroEdit2.exe

      - name: Publicar release
        if: steps.versao.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release create $env:VERSAO dist/HydroEdit2.exe --target $env:GITHUB_SHA --title $env:VERSAO --generate-notes
